name: Build Android APK

on:
  workflow_dispatch: # Allow manual triggering
  push:
    branches:
      - main
    paths:
      - 'mobile/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }} # Needed if you build on Expo's servers, or just useful for the CLI

      - name: Install dependencies
        run: npm ci

      - name: Build APK (Local)
        # We run the local EAS build to generate the APK inside the runner
        run: eas build --platform android --profile preview --local --non-interactive

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: depanceapp-apk
          # The local build typically outputs to a generated file name, we can glob for it
          path: mobile/*.apk
          retention-days: 7
