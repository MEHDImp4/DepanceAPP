services:
  db:
    image: mariadb:11.4
    container_name: depance-db
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change_me_root_password}
      MARIADB_DATABASE: ${DB_NAME:-depance_db}
      MARIADB_USER: ${DB_USER:-depance}
      MARIADB_PASSWORD: ${DB_PASSWORD:-change_me_db_password}
    volumes:
      - depance_db_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p$$MARIADB_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    image: ${DEPANCE_IMAGE:-ghcr.io/mehdimp4/depanceapp:latest}
    container_name: depance-app
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-}
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-depance}
      DB_PASSWORD: ${DB_PASSWORD:-change_me_db_password}
      DB_NAME: ${DB_NAME:-depance_db}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      APP_URL: ${APP_URL:-http://localhost:3000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-false}
      LOGIN_HISTORY_RETENTION_DAYS: ${LOGIN_HISTORY_RETENTION_DAYS:-180}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  backup:
    image: ${DEPANCE_IMAGE:-ghcr.io/mehdimp4/depanceapp:latest}
    container_name: depance-backup
    entrypoint: ["/app/scripts/backup-loop.sh"]
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-depance}
      DB_PASSWORD: ${DB_PASSWORD:-change_me_db_password}
      DB_NAME: ${DB_NAME:-depance_db}
      BACKUP_DIR: /app/backups
      RETENTION_DAYS: ${RETENTION_DAYS:-7}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      BACKUP_ALLOW_UNENCRYPTED: ${BACKUP_ALLOW_UNENCRYPTED:-false}
      BACKUP_S3: ${BACKUP_S3:-false}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-}
    volumes:
      - depance_backups:/app/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  depance_db_data:
  depance_backups:
