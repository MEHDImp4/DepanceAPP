name: Client dependency remediation

on:
  push:
    branches: ["fix/full-audit-2026-09"]
    paths:
      - ".github/workflows/client-dependency-remediation.yml"

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/full-audit-2026-09

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Apply compatible security updates
        working-directory: ./client
        run: |
          npm ci
          npm audit fix
          npm audit --audit-level=high

      - name: Commit updated dependency lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/package.json client/package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes required."
          else
            git commit -m "fix(deps): apply frontend security updates"
            git push origin HEAD:fix/full-audit-2026-09
          fi
